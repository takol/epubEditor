<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服務已搬遷 | Writee EPUB</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://writee.tw/epub/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--text:#1b2333;--muted:#5b6579;--accent:#0057b7;--border:#e2e8f0}
    @media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--text:#e8edf6;--muted:#9aa6bd;--accent:#5aa2ff;--border:#2a3550}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
    main{max-width:480px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem 1.5rem;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .logo svg{max-width:100%;height:auto;width:220px}
    .logo [fill="#1B2333"]{fill:var(--text)}
    h1{font-size:1.35rem;margin:1.5rem 0 .5rem}
    p{color:var(--muted);line-height:1.7;margin:.4rem 0}
    .count{font-size:2.5rem;font-weight:700;color:var(--accent);margin:1rem 0 .2rem;font-variant-numeric:tabular-nums}
    a.btn{display:inline-block;margin-top:1rem;padding:.75rem 1.5rem;background:var(--accent);color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
    a.btn:hover{opacity:.9}
    .url{word-break:break-all;font-size:.9rem}
  </style>
</head>
<body>
  <main>
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 64" width="248" height="64"><rect width="64" height="64" rx="14" fill="#0057B7"></rect><g stroke-linecap="round" stroke-width="6"><path d="M44 16 V48" stroke="#FFFFFF"></path><path d="M32 16 V40" stroke="#FFFFFF"></path><path d="M20 16 V26" stroke="#FFD500"></path></g><g transform="translate(84 -6) scale(0.7)"><g fill="none" stroke="#1B2333" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M2 40 L12 80 L24 50 L36 80 L46 40"></path><path d="M60 80 V40 M60 56 C60 46 67 41 79 41"></path><path d="M93 50 V80"></path><path d="M110 24 V68 C110 76 114 80 122 80 M100 44 H122"></path><path d="M137 60 H171 A17 17 0 1 0 166 72"></path><path d="M185 60 H219 A17 17 0 1 0 214 72"></path></g><circle cx="93" cy="30" r="6.5" fill="#0057B7"></circle></g></svg></div>
    <h1>本服務已搬遷至新網址</h1>
    <p>EPUB 編輯器已移至 <a class="url" href="https://writee.tw/epub/">https://writee.tw/epub/</a></p>
    <div class="count" id="count" aria-live="polite">15</div>
    <p><span id="msg">秒後自動跳轉</span></p>
    <a class="btn" href="https://writee.tw/epub/" id="go">立即前往新網站</a>
    <p><a href="#" id="cancel" style="font-size:.85rem;color:var(--muted)">取消自動跳轉</a></p>
  </main>
  <noscript><p style="text-align:center">請前往 <a href="https://writee.tw/epub/">https://writee.tw/epub/</a></p></noscript>
  <script>
    (function(){
      var URL_='https://writee.tw/epub/',left=15,t;
      var c=document.getElementById('count'),m=document.getElementById('msg');
      function tick(){
        left--;
        if(left<=0){clearInterval(t);c.textContent='0';location.replace(URL_);return}
        c.textContent=left;
      }
      t=setInterval(tick,1000);
      document.getElementById('cancel').addEventListener('click',function(e){
        e.preventDefault();clearInterval(t);c.textContent='—';m.textContent='已取消自動跳轉';this.style.display='none';
      });
    })();
  </script>
</body>
</html>
